name: Promote release to latest

# Final step of the release pipeline. Marks the GitHub Release as "latest" once
# the whole build/publish chain has finished successfully.
#
# The chain is: tag push -> "Build and publish executables" -> (on success)
# "Update packaging metadata" + "Publish npm Package". "Update packaging
# metadata" is the terminal workflow in that chain, so its successful
# completion is the deterministic signal that the release is fully published
# and safe to promote to latest.

on:
  workflow_run:
    workflows: ["Update packaging metadata"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote to latest (e.g., MCP-1.4.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'MCP-')) || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'MCP-')) }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark release as latest
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          gh release edit "$TAG" --latest --draft=false
          echo "Marked $TAG as the latest release." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
