name: Create GitHub Release

# Tag-triggered entry point for a release. Pushing an MCP-<version> tag is the
# single action a developer performs to cut a release. This workflow creates the
# GitHub Release for that tag with deterministic, auto-generated release notes
# (GitHub's generate-notes engine, configured by .github/release.yml, which
# categorizes merged PRs by label).
#
# The same tag push also triggers build-exe.yml and build-release.yml. Those
# upload artifacts to this release and fan out to the publish + update
# workflows. The release is created WITHOUT the "latest" flag;
# promote-release-latest.yml sets it as latest once every downstream
# publish/update workflow has completed successfully.
#
# This workflow runs first so the release exists with proper generated notes
# before build-exe.yml's upload step runs. It is idempotent: if the release was
# already created (e.g. by an artifact upload racing ahead), it regenerates and
# applies the notes instead of failing.

on:
  push:
    tags:
      - 'MCP-[0-9]+.[0-9]+.[0-9]+'
      - 'MCP-[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: create-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create or update GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --generate-notes uses GitHub's deterministic generate-notes engine,
          # categorizing merged PRs per .github/release.yml. Not marked latest
          # yet; promote-release-latest.yml does that after all builds succeed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; regenerating notes."
            NOTES="$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body')"
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --latest=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --latest=false \
              --verify-tag
          fi

      - name: Summary
        run: |
          echo "Created release ${{ github.ref_name }} (not yet latest)." >> "$GITHUB_STEP_SUMMARY"
          echo "Build and publish pipelines were triggered by the same tag push." >> "$GITHUB_STEP_SUMMARY"
