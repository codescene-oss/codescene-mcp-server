name: Create Release

# Entry point for cutting a release. A developer (or the AI release skill) runs
# this with the desired version. It creates and pushes the MCP-<version> tag,
# then creates the GitHub Release with deterministic, auto-generated release
# notes (via the generate-notes REST API, configured by .github/release.yml).
#
# Pushing the tag triggers build-exe.yml and build-release.yml, which in turn
# fan out to the publish + update workflows. The release is created WITHOUT the
# "latest" flag; promote-release-latest.yml sets it as latest once every
# downstream publish/update workflow has completed successfully.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the MCP- prefix (e.g. 1.4.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          # Strip an accidental leading MCP- if the user included it.
          VERSION="${VERSION#MCP-}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected semver like 1.4.3 or 1.4.3-rc.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=MCP-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release with generated notes
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # --generate-notes uses GitHub's deterministic generate-notes engine,
          # categorizing merged PRs per .github/release.yml. Not marked latest
          # yet; promote-release-latest.yml does that after all builds succeed.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest=false \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "Created release ${{ steps.version.outputs.tag }} (not yet latest)." >> "$GITHUB_STEP_SUMMARY"
          echo "Build and publish pipelines were triggered by the tag push." >> "$GITHUB_STEP_SUMMARY"
