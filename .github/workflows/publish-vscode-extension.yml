name: Publish VS Code Extension (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to download VSIXs from (e.g. MCP-1.2.3). Defaults to latest."
        required: false
        type: string
      publish_vscode_marketplace:
        type: boolean
        default: true
        description: Publish to VS Code Marketplace
      publish_open_vsx:
        type: boolean
        default: true
        description: Publish to Open VSX
      dry_run:
        type: boolean
        default: false
        description: Verify release assets and Marketplace publish rights without publishing

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest

    steps:
      - name: Download VSIX files from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download ${TAG:+"$TAG"} \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'codescene-codehealth-mcp-*.vsix' \
            --dir ./vsix-artifacts

      - name: Verify VSIX files
        run: |
          set -euo pipefail
          targets=("win32-x64" "darwin-x64" "darwin-arm64" "linux-x64" "linux-arm64")
          for target in "${targets[@]}"; do
            file=$(find ./vsix-artifacts -name "codescene-codehealth-mcp-${target}-*.vsix" | head -1)
            if [ -z "$file" ]; then
              echo "Missing VSIX for ${target}"
              exit 1
            fi
            echo "Found ${file}"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Azure login (OIDC)
        if: inputs.publish_vscode_marketplace
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PUBLISHING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PUBLISHING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify VS Code Marketplace publish rights
        if: inputs.publish_vscode_marketplace
        run: |
          npm install -g @vscode/vsce@4.0.0
          vsce verify-pat --azure-credential codescene

      - name: Publish to VS Code Marketplace
        if: inputs.publish_vscode_marketplace && !inputs.dry_run
        run: |
          for file in ./vsix-artifacts/*.vsix; do
            echo "Publishing ${file} to VS Code Marketplace"
            if output=$(vsce publish --azure-credential --packagePath "${file}" 2>&1); then
              echo "$output"
            elif [[ "$output" == *"already exists"* ]]; then
              echo "$output"
              echo "Package already exists; continuing with remaining platforms."
            else
              echo "$output" >&2
              exit 1
            fi
          done

      - name: Publish to Open VSX
        if: inputs.publish_open_vsx && !inputs.dry_run && env.OPEN_VSX_PUBLISHING_TOKEN != ''
        env:
          OPEN_VSX_PUBLISHING_TOKEN: ${{ secrets.OPEN_VSX_PUBLISHING_TOKEN }}
        run: |
          npm install -g ovsx
          for file in ./vsix-artifacts/*.vsix; do
            echo "Publishing ${file} to Open VSX"
            ovsx publish --skip-duplicate --pat "$OPEN_VSX_PUBLISHING_TOKEN" --packagePath "${file}"
          done
