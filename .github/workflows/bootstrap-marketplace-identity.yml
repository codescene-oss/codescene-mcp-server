name: Bootstrap Marketplace publishing identity (one-off)

on:
  workflow_dispatch:
  push:
    branches:
      - CS-11609-marketplace-entra-publishing
    paths:
      - .github/workflows/bootstrap-marketplace-identity.yml

permissions:
  id-token: write
  contents: read

jobs:
  profile:
    name: Resolve Marketplace profile ID
    runs-on: ubuntu-latest

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PUBLISHING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PUBLISHING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch Azure DevOps profile
        run: |
          set -euo pipefail
          profile=$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798)
          echo "$profile" | jq .
          profile_id=$(echo "$profile" | jq -r '.id')
          echo "Marketplace member ID: ${profile_id}"
          {
            echo "### Marketplace member ID"
            echo
            echo "Add \`${profile_id}\` as a Contributor on the codescene publisher."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify publish rights
        run: |
          set -euo pipefail
          npm install --global @vscode/vsce@4.0.0
          vsce verify-pat --azure-credential codescene
