name: Build and Publish Docker Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example, MCP-1.2.3)'
        required: true
        type: string

env:
  DOCKERHUB_REPO: codescene/codescene-mcp
  
jobs:
  build-docker:
    runs-on: ubuntu-24.04
    steps:
      # Checkout source code and setup
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^MCP-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          }
      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ inputs.tag }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ inputs.tag }}
            ${{ env.DOCKERHUB_REPO }}:latest
